name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # kcv links against the macOS Security framework, so it can only be
    # built and tested on macOS.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Add rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      # The suite creates and deletes throwaway keychain files. It never
      # touches the runner's login keychain and never needs a GUI prompt.
      - name: Test
        run: cargo test --verbose
