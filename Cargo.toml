[package]
name = "kcv"
version = "0.1.0"
edition = "2024"
description = "Store environment secrets in the macOS keychain and inject them into a process"
repository = "https://github.com/ipmb/kcv"
license = "MIT"
readme = "README.md"
keywords = ["keychain", "macos", "secrets", "environment"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
libc = "0.2.189"
security-framework = "3.7.0"
serde_json = "1.0.151"
